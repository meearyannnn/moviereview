<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1017"/>
      <stop offset="60%" stop-color="#140a0e"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd666"/>
      <stop offset="50%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5c542" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Obsidian Cinema Canvas -->
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect width="500" height="750" fill="url(#glow)"/>
  
  <!-- Subtle Cinema Border -->
  <rect x="1.5" y="1.5" width="497" height="747" rx="16" stroke="#c9a24b" stroke-opacity="0.2" stroke-width="3"/>
  
  <!-- Center Clapperboard Icon -->
  <g transform="translate(190, 290)">
    <!-- Clapper base -->
    <rect x="0" y="32" width="120" height="85" rx="8" fill="#1e141a" stroke="#c9a24b" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Clapper top stick -->
    <path d="M-4 28 L124 10 L124 -4 L-4 14 Z" fill="url(#gold)"/>
    <line x1="22" y1="24" x2="14" y2="4" stroke="#140a0e" stroke-width="5"/>
    <line x1="52" y1="20" x2="44" y2="0" stroke="#140a0e" stroke-width="5"/>
    <line x1="82" y1="15" x2="74" y2="-4" stroke="#140a0e" stroke-width="5"/>
    <line x1="112" y1="11" x2="104" y2="-8" stroke="#140a0e" stroke-width="5"/>
    
    <!-- Film slate lines -->
    <line x1="16" y1="58" x2="104" y2="58" stroke="#c9a24b" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <line x1="16" y1="84" x2="104" y2="84" stroke="#c9a24b" stroke-width="2" stroke-opacity="0.3"/>
  </g>
  
  <!-- MovieGuy Brand Text -->
  <text x="250" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#f5c542" text-anchor="middle" opacity="0.85">
    MOVIEGUY CINEMA
  </text>
  <text x="250" y="468" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="1" fill="#ffffff" text-anchor="middle" opacity="0.4">
    POSTER ARCHIVE
  </text>
</svg>